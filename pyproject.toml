[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dpa"
version = "0.1.0"
description = "Adaptive Data Pipeline Agent"
requires-python = ">=3.11"
dependencies = [
    "rhosocial-activerecord>=1.0.0.dev30",
    "rhosocial-activerecord-postgres>=1.0.0.dev17",
    "rhosocial-stateflow",
    "rhosocial-user",
    "pydantic>=2.12.0",
    "httpx>=0.27.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
dpa = "dpa.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/dpa"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
